esphome:
  name: flexit-modbus
  friendly_name: Flexit Ventilation
  on_boot:
    # Runs after the Modbus server (priority 1000) and the numbers (800) are set up,
    # and before the server has handled a single frame, so what gets written here is
    # the first answer the CS60 gets.
    - priority: -100
      then:
        # Min/Max: restored from flash (40/90 if nothing is saved yet). Send them to
        # the unit once, so a Max-timer press after a reboot finds a valid value. The
        # coil stays raised until the CS60 confirms with 0x65, so no delay is needed.
        - lambda: |-
            using namespace flexit_modbus_server;
            auto *srv = id(server);
            auto mn = (uint16_t) id(fan_min)->state;
            auto mx = (uint16_t) id(fan_max)->state;
            srv->send_cmd(REG_CMD_PERCENTAGE_SUPPLY_FAN_MIN,  mn);
            srv->send_cmd(REG_CMD_PERCENTAGE_EXTRACT_FAN_MIN, mn);
            srv->send_cmd(REG_CMD_PERCENTAGE_SUPPLY_FAN_MAX,  mx);
            srv->send_cmd(REG_CMD_PERCENTAGE_EXTRACT_FAN_MAX, mx);

        # Normal: wait for mode information, i.e. the status block itself. REG_MODE
        # is 0 in Stop and also before the first block, so watch 0xBE (temperature
        # setpoint), the block's first register. On timeout, mode still reads 0 and
        # the lambda below serves the fallback.
        - wait_until:
            condition:
              lambda: 'return id(server)->read_holding_register(flexit_modbus_server::REG_TEMPERATURE_SETPOINT) != 0;'
            timeout: 10s

        # Mode and supply fan speed arrive in the same frame, so no second wait.
        - lambda: |-
            using namespace flexit_modbus_server;
            auto *srv = id(server);
            auto v = (uint16_t) id(fan_normal)->state;        // 60, from initial_value
            uint16_t fan = srv->read_holding_register(REG_PERCENTAGE_SUPPLY_FAN);
            if (srv->read_holding_register(REG_MODE) == 2 && fan > 0) {
              v = fan;                                        // Normal: take what the unit runs
              id(fan_normal)->publish_state(v);               // HA only, no flash
            }
#            // Serve it for supply and extract, without raising the coil.
#            srv->write_holding_register(REG_CMD_PERCENTAGE_SUPPLY_FAN_NORMAL,  v);
#            srv->write_holding_register(REG_CMD_PERCENTAGE_EXTRACT_FAN_NORMAL, v);

esp32:
  variant: esp32
  framework:
    type: arduino
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
      flash_chip: generic
wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password

  reboot_timeout: 15min
  # Disable modem power-save; it causes the brief dropouts seen in the HA trace.
  power_save_mode: none

logger:
  level: DEBUG
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key
  # Don't reboot when Home Assistant is unreachable (e.g. an HA restart).
  # Default is 15 min -> a reboot -> CS60 desync. Keep the Modbus link alive.
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

external_components:
  - source:
      type: git
      url: https://github.com/peetervalk/esphome-flexit-modbus-server
      ref: live

#      type: local
#      path: esphome/components
    components:
      - flexit_modbus_server
    refresh: 0s

debug:
  update_interval: 30s

uart:
  id: modbus_uart
  tx_pin: GPIO18
  rx_pin: GPIO19
  baud_rate: 115200
  rx_buffer_size: 1024

flexit_modbus_server:
  - id: server
    uart_id: modbus_uart
    address: 1
    tcp_bridge_enabled: true   # listens on port 502
    # ESP-ModbusRTUServer branch, tag or commit.
    # A branch is cloned once: use Clean Build Files to pick up new commits.
    modbus_library_ref: main
    # The component keeps nothing in flash (both default to true, as upstream).
    # Min/Max are restored by the numbers below; Normal is never saved.
    persist_settings: false
    persist_runtime_counters: false


text_sensor:
  - platform: template
    name: "Ventilation Mode"
    update_interval: 30s
    lambda: |-
      return flexit_modbus_server::mode_to_string(
        id(server)->read_holding_register(flexit_modbus_server::REG_MODE)
      );
  - platform: debug
    reset_reason:
      name: "Reset reason"

number:
  # Min/Max are the speeds the CS60 uses in its Min and Max modes, so they only
  # take visible effect once that mode is active (or the MAX timer runs).
  # None of the three reads back a register: the CS60 stores no setpoints, and the
  # command registers read 0 after a boot. Boot values come from esphome: on_boot.
  # No lambdas here: a lambda turns off restore_value and initial_value.
  - platform: template
    id: fan_min
    name: "Fan Speed Minimum"
    unit_of_measurement: "%"
    mode: box
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true   # written to flash only when you change it
    initial_value: 40     # used only when nothing is saved yet
    set_action:
      - lambda: |-
          id(server)->send_cmd(flexit_modbus_server::REG_CMD_PERCENTAGE_SUPPLY_FAN_MIN, (uint16_t)x);
          id(server)->send_cmd(flexit_modbus_server::REG_CMD_PERCENTAGE_EXTRACT_FAN_MIN, (uint16_t)x);

  # Set by the HA automation every 5 min, so no restore_value: never written to
  # flash. Starts at 60 on every boot; on_boot replaces that with the unit's
  # running speed if the unit is in Normal.
  - platform: template
    id: fan_normal
    name: "Fan Speed Normal"
    unit_of_measurement: "%"
    mode: box
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    initial_value: 60     # the fixed fallback
    set_action:
      - lambda: |-
          id(server)->send_cmd(flexit_modbus_server::REG_CMD_PERCENTAGE_SUPPLY_FAN_NORMAL, (uint16_t)x);
          id(server)->send_cmd(flexit_modbus_server::REG_CMD_PERCENTAGE_EXTRACT_FAN_NORMAL, (uint16_t)x);

  # Same caveats as Fan Speed Minimum above.
  - platform: template
    id: fan_max
    name: "Fan Speed Maximum"
    unit_of_measurement: "%"
    mode: box
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true   # written to flash only when you change it
    initial_value: 90     # used only when nothing is saved yet
    set_action:
      - lambda: |-
          id(server)->send_cmd(flexit_modbus_server::REG_CMD_PERCENTAGE_SUPPLY_FAN_MAX, (uint16_t)x);
          id(server)->send_cmd(flexit_modbus_server::REG_CMD_PERCENTAGE_EXTRACT_FAN_MAX, (uint16_t)x);


sensor:
  # Temperatures are signed (x0.1 °C). read_holding_register_temperature() casts to
  # int16_t first; read_holding_register() / 10.0 turns -0.1 °C into 6553.5 °C.
  - platform: template
    name: "Temperature Setpoint"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    force_update: true
    lambda: "return id(server)->read_holding_register_temperature(flexit_modbus_server::REG_TEMPERATURE_SETPOINT);"
    update_interval: 30s

  - platform: template
    name: "Supply Air Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    force_update: true
    lambda: "return id(server)->read_holding_register_temperature(flexit_modbus_server::REG_TEMPERATURE_SUPPLY_AIR);"
    update_interval: 30s

  - platform: template
    name: "Extract Air Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    force_update: true
    lambda: "return id(server)->read_holding_register_temperature(flexit_modbus_server::REG_TEMPERATURE_EXTRACT_AIR);"
    update_interval: 30s

  - platform: template
    name: "Outdoor Air Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    force_update: true
    lambda: "return id(server)->read_holding_register_temperature(flexit_modbus_server::REG_TEMPERATURE_OUTDOOR_AIR);"
    update_interval: 30s

  - platform: template
    name: "Supply Fan Speed"
    unit_of_measurement: "%"
    state_class: measurement
    force_update: true
    lambda: "return id(server)->read_holding_register(flexit_modbus_server::REG_PERCENTAGE_SUPPLY_FAN);"
    update_interval: 30s

  - platform: template
    name: "Heat Exchanger Efficiency"
    unit_of_measurement: "%"
    state_class: measurement
    force_update: true
    lambda: "return id(server)->read_holding_register(flexit_modbus_server::REG_PERCENTAGE_HEAT_EXCHANGER);"
    update_interval: 30s

  - platform: template
    name: "Heater Power"
    unit_of_measurement: "%"
    state_class: measurement
    force_update: true
    lambda: "return id(server)->read_holding_register(flexit_modbus_server::REG_PERCENTAGE_HEATING);"
    update_interval: 30s

  # --- Diagnostics: so reboots and weak WiFi are finally visible ---
  - platform: uptime
    name: "Uptime"

  - platform: debug
    free:
      name: "Free heap"

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "Status"

switch:
  - platform: template
    id: supply_air_control
    name: "Supply Air Regulation"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: "id(server)->send_cmd(flexit_modbus_server::REG_CMD_TEMPERATURE_SUPPLY_AIR_CONTROL, 1);"
    turn_off_action:
      - lambda: "id(server)->send_cmd(flexit_modbus_server::REG_CMD_TEMPERATURE_SUPPLY_AIR_CONTROL, 0);"

  - platform: template
    id: heater
    name: "Heater"
    restore_mode: DISABLED
    lambda: "return id(server)->read_holding_register(flexit_modbus_server::REG_STATUS_HEATER);"
    turn_on_action:
      - lambda: "id(server)->send_cmd(flexit_modbus_server::REG_CMD_HEATER_PANEL1, 1);"
    turn_off_action:
      - lambda: "id(server)->send_cmd(flexit_modbus_server::REG_CMD_HEATER_PANEL1, 0);"


  - platform: gpio
    pin: GPIO25
    name: "Dry contact"
    id: dry_contact
    restore_mode: ALWAYS_OFF

button:
  - platform: template
    name: "Clear Alarms"
    on_press:
      - lambda: "id(server)->send_cmd(flexit_modbus_server::REG_CMD_CLEAR_ALARMS, 1);"

  - platform: template
    name: "Reset Filter Interval"
    on_press:
      - lambda: "id(server)->send_cmd(flexit_modbus_server::REG_CMD_CLEAR_FILTER_ALARM, 1);"